<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">WaveShare N32R16V at 240 MHz benchmark timing changes</title>
  <desc id="desc">Representative 0.2.0 to 0.3.0 timing changes. Negative values are faster and positive values are slower.</desc>
  <rect x="1" y="1" width="958" height="358" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #24292f; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle, .axis { font-size: 14px; fill: #57606a; }
    .workload { font-size: 16px; font-weight: 600; }
    .value { font-size: 15px; font-weight: 700; }
  </style>
  <text x="28" y="38" class="title">WaveShare N32R16V at 240 MHz</text>
  <text x="28" y="64" class="subtitle">0.2.0 → 0.3.0 timing change; negative is faster, positive is slower</text>
  <rect x="305" y="91" width="285" height="230" fill="#f0fff4"/>
  <rect x="590" y="91" width="285" height="230" fill="#fff5f5"/>
  <line x1="305" y1="91" x2="305" y2="321" stroke="#d8dee4"/>
  <line x1="447.5" y1="91" x2="447.5" y2="321" stroke="#d8dee4" stroke-dasharray="4 4"/>
  <line x1="590" y1="91" x2="590" y2="321" stroke="#57606a" stroke-width="2"/>
  <line x1="732.5" y1="91" x2="732.5" y2="321" stroke="#d8dee4" stroke-dasharray="4 4"/>
  <line x1="875" y1="91" x2="875" y2="321" stroke="#d8dee4"/>
  <text x="28" y="146" class="workload">encode/1</text>
  <rect x="590.0" y="125" width="43.8" height="30" rx="4" fill="#65AE00"/>
  <text x="643.8" y="146" text-anchor="start" class="value">+0.02%</text>
  <text x="28" y="218" class="workload">decode/1</text>
  <rect x="590.0" y="197" width="230.9" height="30" rx="4" fill="#65AE00"/>
  <text x="830.9" y="218" text-anchor="start" class="value">+0.11%</text>
  <text x="28" y="290" class="workload">partial_decode/1</text>
  <rect x="590.0" y="269" width="74.2" height="30" rx="4" fill="#65AE00"/>
  <text x="674.2" y="290" text-anchor="start" class="value">+0.03%</text>
  <text x="305" y="344" text-anchor="middle" class="axis">−0.13%</text>
  <text x="447.5" y="344" text-anchor="middle" class="axis">−0.07%</text>
  <text x="590" y="344" text-anchor="middle" class="axis">0%</text>
  <text x="732.5" y="344" text-anchor="middle" class="axis">+0.07%</text>
  <text x="875" y="344" text-anchor="middle" class="axis">+0.13%</text>
</svg>
