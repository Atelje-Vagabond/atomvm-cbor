name: Publish Hex 0.2.0

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  preflight:
    name: Tag and public preflight
    if: github.ref == 'refs/tags/0.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0.2.0
          fetch-depth: 0
      - name: Assert immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/tags/0.2.0"
          tag_commit="$(git rev-parse '0.2.0^{}')"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          test "$(cat VERSION)" = "0.2.0"
          tag_count="$(git tag --points-at HEAD | awk '$0 == "0.2.0" { count++ } END { print count + 0 }')"
          test "${tag_count}" -eq 1
          if git ls-remote --exit-code --tags origin refs/tags/v0.2.0 >/dev/null 2>&1; then
            echo "forbidden v0.2.0 tag exists" >&2
            exit 1
          fi
          gate_count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag_commit}/check-runs" \
            --jq '[.check_runs[] | select(.name == "Exact-head release gate" and .conclusion == "success")] | length')"
          test "${gate_count}" -ge 1
      - name: Install Erlang, Elixir, and Rebar3
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236
        with:
          otp-version: "27"
          elixir-version: "1.18"
          rebar3-version: "3.25.1"
      - name: Run complete public gate
        env:
          HEX_API_KEY: "00000000000000000000000000000000"
        run: |
          set -euo pipefail
          bash scripts/check-public-hygiene.sh
          bash scripts/release-check.sh 0.2.0
          COVERAGE_BASE_REF=HEAD^ bash scripts/coverage-gate.sh
          rebar3 dialyzer
          rebar3 ex_doc
          index="$(find . -type f -name index.html | grep -E '(^|/)doc/index.html$' | grep -v '/plugins/' | head -n 1)"
          test -n "${index}"
          docs_dir="$(dirname "${index}")"
          grep -RFl 'github.com/Atelje-Vagabond/atomvm-cbor' "${docs_dir}" >/dev/null
          grep -REl '/(blob|tree)/0\.2\.0/' "${docs_dir}" >/dev/null
          rebar3 hex build
          rebar3 hex build --unpack
          rebar3 hex publish --repo hexpm --dry-run --yes
          package_dir="$(find _build -type d -name 'atomvm_cbor-0.2.0' -print -quit)"
          test -n "${package_dir}"
          bash scripts/check-hex-package.sh "${package_dir}"
          package_tar="$(find _build -type f -name 'atomvm_cbor-0.2.0.tar' -print -quit)"
          test -n "${package_tar}"
          checksum="$(sha256sum "${package_tar}" | cut -d ' ' -f1)"
          if curl -fsS https://hex.pm/api/packages/atomvm_cbor/releases/0.2.0 >/dev/null; then
            python3 scripts/verify-hex-release.py published --checksum "${checksum}"
          else
            code="$(curl -sS -o /dev/null -w '%{http_code}' https://hex.pm/api/packages/atomvm_cbor/releases/0.2.0)"
            test "${code}" = "404"
            python3 scripts/verify-hex-release.py absent
          fi

  publish:
    name: Publish package, HexDocs, and GitHub release
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: hex-production
    permissions:
      contents: write
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0.2.0
          fetch-depth: 0
      - name: Install Erlang and Rebar3
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236
        with:
          otp-version: "27"
          elixir-version: "1.18"
          rebar3-version: "3.25.1"
      - name: Rebuild and determine publication state
        id: state
        run: |
          set -euo pipefail
          test -n "${HEX_API_KEY}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse '0.2.0^{}')"
          rebar3 hex build
          package_tar="$(find _build -type f -name 'atomvm_cbor-0.2.0.tar' -print -quit)"
          test -n "${package_tar}"
          checksum="$(sha256sum "${package_tar}" | cut -d ' ' -f1)"
          test -n "${checksum}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          if curl -fsS https://hex.pm/api/packages/atomvm_cbor/releases/0.2.0 >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            code="$(curl -sS -o /dev/null -w '%{http_code}' https://hex.pm/api/packages/atomvm_cbor/releases/0.2.0)"
            test "${code}" = "404"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish public Hex package and HexDocs
        if: steps.state.outputs.exists == 'false'
        run: rebar3 hex publish --repo hexpm --yes
      - name: Verify public package identity, checksum, organization, and docs
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if python3 scripts/verify-hex-release.py published --checksum "${{ steps.state.outputs.checksum }}"; then
              exit 0
            fi
            echo "Hex propagation verification attempt ${attempt}/12 did not pass yet."
            sleep 5
          done
          exit 1
      - name: Create GitHub release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 0.2.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            existing_target="$(gh release view 0.2.0 --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)"
            test "$(git rev-parse "${existing_target}^{commit}")" = "$(git rev-parse HEAD)"
          else
            gh release create 0.2.0 \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "atomvm-cbor 0.2.0" \
              --notes-file .github/releases/0.2.0.md
          fi
      - name: Verify published Rebar3 consumer
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          mkdir -p "${consumer}/src"
          printf '{erl_opts, [debug_info]}.\n{deps, [{avm_cbor, "~> 0.2.0", {pkg, atomvm_cbor}}]}.\n' > "${consumer}/rebar.config"
          printf '{application, published_rebar_consumer, [{vsn, "0.1.0"}, {modules, [published_rebar_consumer]}, {applications, [kernel, stdlib, avm_cbor]}]}.\n' > "${consumer}/src/published_rebar_consumer.app.src"
          printf -- '-module(published_rebar_consumer).\n-export([run/0]).\nrun() -> avm_cbor:decode(<<1>>).\n' > "${consumer}/src/published_rebar_consumer.erl"
          (cd "${consumer}" && rebar3 compile)
      - name: Verify published Mix consumer
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          mkdir -p "${consumer}/lib"
          printf 'defmodule PublishedMixConsumer.MixProject do\n  use Mix.Project\n  def project, do: [app: :published_mix_consumer, version: "0.1.0", deps: [{:avm_cbor, "~> 0.2.0", hex: :atomvm_cbor}]]\n  def application, do: [extra_applications: [:avm_cbor]]\nend\n' > "${consumer}/mix.exs"
          printf 'defmodule PublishedMixConsumer do\n  def run, do: :avm_cbor.decode(<<1>>)\nend\n' > "${consumer}/lib/published_mix_consumer.ex"
          (cd "${consumer}" && mix local.hex --force && mix deps.get && mix compile --warnings-as-errors)
